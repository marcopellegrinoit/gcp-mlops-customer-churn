[project]
name = "obs-common"
version = "0.1.0"
requires-python = ">=3.12"
# Deliberately stdlib-only. Every deployable installs this package, so a dependency added
# here lands in every image — including the ones that carry no ML or GCP libraries at all.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=obs_common --cov-report=term-missing"
