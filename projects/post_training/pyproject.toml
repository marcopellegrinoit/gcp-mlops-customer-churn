[project]
name = "post-training"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # DS package — resolved as a workspace path dependency by uv. This image never loads or
    # scores a model itself (that happens in the serving image, against the serving container
    # that will run it in production); it only runs the champion/challenger gate math over
    # predictions it's handed, so it needs ml-common for that plus pandas/preprocess helpers,
    # not xgboost/scikit-learn directly.
    "ml-common",
    # MLE package — stdlib-only Cloud Logging setup, shared by every container entrypoint.
    "obs-common",
    "pandas>=3,<4",
    # Infrastructure — GCP client libs track only major versions
    "db-dtypes>=1.7.1,<2",
    "google-cloud-aiplatform>=1.50.0,<2",
    "google-cloud-bigquery>=3.0.0,<4",
    "google-cloud-bigquery-storage>=2.0.0,<3",
    "google-cloud-storage>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.0.0",
]

[tool.uv.sources]
ml-common = { workspace = true }
obs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/post_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=post_training --cov-report=term-missing"
markers = [
    "integration: tests requiring live GCP services (deselect with -m 'not integration')",
]
