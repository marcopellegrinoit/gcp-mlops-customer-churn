[project]
name = "trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # DS packages — resolved as workspace path dependencies by uv.
    # Exact ML library versions (xgboost, pandas, sklearn, etc.) are pinned there;
    # ranges here let the DS bump versions without touching engineering code.
    "modeling",
    "ml-common",
    # MLE package — stdlib-only Cloud Logging setup, shared by every container entrypoint.
    "obs-common",
    # Direct imports in trainer — loose ranges, exact pins owned by ml-common
    "pandas>=3,<4",
    "xgboost>=3,<4",
    "scikit-learn>=1,<2",
    # Infrastructure — GCP client libs track only major versions
    "db-dtypes>=1.0.0,<2",
    "google-cloud-aiplatform>=1.50.0,<2",
    "google-cloud-bigquery>=3.0.0,<4",
    "google-cloud-bigquery-storage>=2.0.0,<3",
    "google-cloud-storage>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Notebook-only: plotting and stats for the DS exploration notebooks in notebooks/
    "matplotlib>=3.9.0,<4",
    "scipy>=1.13.0,<2",
    # Notebook-only: progress bar widget rendering for tqdm in Jupyter
    "ipywidgets>=8.0.0,<9",
]

[tool.uv.sources]
modeling = { workspace = true }
ml-common = { workspace = true }
obs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=trainer --cov-report=term-missing"
markers = [
    "integration: tests requiring live GCP services (deselect with -m 'not integration')",
]
