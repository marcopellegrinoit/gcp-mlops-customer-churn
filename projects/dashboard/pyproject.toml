[project]
name = "dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Cloud Logging-aware log setup, as in every other container.
    "obs-common",
    # The platform's shared data schemas. Pure pydantic, which is the whole reason they are
    # their own package rather than part of ml-common: this app needs to agree with the
    # serving container on two column names, and depending on ml-common to get them would
    # drag xgboost and scikit-learn into an image that only renders charts.
    "data-contracts",
    # Deliberately still NOT ml-common: this app never loads a model or scores anything. It
    # reads a table the pipeline already wrote.
    "streamlit>=1.42,<2",
    "google-cloud-bigquery>=3,<4",
    "pandas>=3,<4",
    # BigQuery's to_dataframe() needs db-dtypes for DATE/TIME columns; without it a
    # snapshot_date column raises at query time rather than at import.
    "db-dtypes>=1.2,<2",
    # Range rather than ml_common's exact pin: this image is not part of the training/
    # serving parity contract that motivates pinning there. It must stay compatible with
    # it regardless, since the workspace resolves one pyarrow for every package.
    "pyarrow>=25.0.1,<26",
    "altair>=6,<7",
    "pydantic>=2,<3",
    "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
obs-common = { workspace = true }
data-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=dashboard --cov-report=term-missing"
