[project]
name = "serving"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # DS package — resolved as a workspace path dependency by uv. No optuna/shap:
    # this image only ever loads a trained model and scores it, never trains one.
    "ml-common",
    "xgboost>=3,<4",
    "scikit-learn>=1,<2",
    "pandas>=3,<4",
    # Vertex AI custom-container batch-prediction contract
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.30.0,<1",
    "pydantic-settings>=2,<3",
    # Infrastructure — GCP client libs track only major versions
    "google-cloud-storage>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
ml-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=serving --cov-report=term-missing"
markers = [
    "integration: tests requiring live GCP services (deselect with -m 'not integration')",
]
