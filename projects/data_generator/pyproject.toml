[project]
name = "data-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # MLE package — stdlib-only Cloud Logging setup, shared by every container entrypoint.
    "obs-common",
    "google-cloud-bigquery>=3.0.0",
    "numpy>=2.5.2",
    # data_generator.schema (the raw.activity_cdc row contract) and data_generator.config
    # (env-driven settings). Deliberately not ml-common: this job produces the platform's
    # source data and must not depend on anything that reads it.
    "pydantic>=2,<3",
    "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.0.0",
]

[tool.uv.sources]
obs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=data_generator --cov-report=term-missing"
markers = [
    "integration: tests requiring Docker and a running BigQuery emulator (deselect with -m 'not integration')",
]
