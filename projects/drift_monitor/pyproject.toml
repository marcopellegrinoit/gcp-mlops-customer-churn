[project]
name = "drift-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # DS package — resolved as a workspace path dependency by uv. Only needed for the
    # shared PSI logic and the training-time feature column conventions.
    "ml-common",
    # Shared data schemas — imported directly, so declared directly.
    "data-contracts",
    # MLE package — stdlib-only Cloud Logging setup, shared by every container entrypoint.
    "obs-common",
    "pandas>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.14.2,<3",
    # Required by google-cloud-bigquery's to_dataframe() for BQ DATE/TIME dtypes.
    "db-dtypes>=1.7.1,<2",
    # Infrastructure — GCP client libs track only major versions
    "google-cloud-aiplatform>=1.50.0,<2",
    "google-cloud-bigquery>=3.0.0,<4",
    # Storage Read API backend for to_dataframe(); without it the client falls back to the
    # paginated REST endpoint and warns. Needs roles/bigquery.readSessionUser on the job SA.
    "google-cloud-bigquery-storage>=2.0.0,<3",
    "google-cloud-storage>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
data-contracts = { workspace = true }
ml-common = { workspace = true }
obs-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=drift_monitor --cov-report=term-missing"
