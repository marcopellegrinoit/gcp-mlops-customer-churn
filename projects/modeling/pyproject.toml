[project]
name = "modeling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # preprocess/evaluate (no optuna/shap) live in ml-common, shared with serving.
    "ml-common",
    # Pinned exactly to prevent silent behaviour changes on re-lock — train.py/hpo.py only.
    "xgboost==3.2.0",
    "optuna==4.9.0",
    "shap==0.52.0",
    "scikit-learn==1.9.0",
    "numpy==2.5.2",
    "pandas==3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
ml-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=modeling --cov-report=term-missing"
