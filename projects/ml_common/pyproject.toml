[project]
name = "ml-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly to prevent silent behaviour changes on re-lock
    "xgboost==3.2.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.2",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    # The platform's shared data schemas, as a workspace path dependency. Pure pydantic, so
    # taking it here costs nothing beyond what ml_common.config already needs.
    "data-contracts",
    # ml_common.config: the env-driven model policy. Pinned for the same reason as the ML
    # libraries — a change in how settings are parsed changes what a run is judged by.
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
data-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ml_common --cov-report=term-missing"
