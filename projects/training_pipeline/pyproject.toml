[project]
name = "training-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # DS package for HPO/fold defaults — resolved as a workspace path dependency.
    "modeling",
    # KFP v2 SDK: compile and submit pipelines to Vertex AI Pipelines.
    "kfp>=2.0.0,<3",
    # Prebuilt Vertex AI ops (ModelGetOp, ModelBatchPredictOp) for the champion batch-predict branch.
    "google-cloud-pipeline-components>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv.sources]
modeling = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=training_pipeline --cov-report=term-missing"
