[project]
name = "data-contracts"
version = "0.1.0"
requires-python = ">=3.12"
# Pydantic and nothing else. This package is installed into every image that reads or writes
# one of the platform's schemas, so the discipline obs_common applies to the standard library
# applies here to dependencies: anything added lands in all of them. Keeping it to pydantic is
# also what lets `dashboard` depend on it — that image renders charts and must not acquire
# xgboost and scikit-learn just to agree on a column name.
#
# Pinned exactly, like the ML libraries in ml-common: a change in how pydantic validates or
# serialises would alter what lands in a model artifact that outlives the code that wrote it.
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=data_contracts --cov-report=term-missing"
