cloud_run_jobs:
  dbt-job:
    description: "dbt feature engineering transformation job"
    ar_repository: "containers"
    image_name: "dbt"
    image_tag: "latest"
    cpu: "1"
    memory: "1Gi"
    timeout: "1200s"
    max_retries: 1
    env_vars:
      BQ_LOCATION: "europe-west1"
    bq_dataset_roles:
      raw: "roles/bigquery.dataViewer"
      features: "roles/bigquery.dataEditor"
    service_account_project_roles:
      - "roles/bigquery.jobUser"

  data-gen-job:
    description: "Synthetic CDC data generation job"
    ar_repository: "containers"
    image_name: "data-gen"
    image_tag: "latest"
    cpu: "1"
    memory: "512Mi"
    timeout: "600s"
    max_retries: 1
    env_vars:
      BQ_DATASET_ID: "raw"
      BQ_TABLE_ID: "activity_cdc"
      # New customers acquired per elapsed day since the generator's pool epoch. Customer
      # identities are otherwise stable across runs, so without acquisition the base only
      # shrinks as customers churn and its tenure distribution climbs without bound.
      DAILY_ACQUISITIONS: "25"
    bq_dataset_roles:
      # dataEditor covers both the event insert and the read-back of already-churned
      # customers, which is what makes churn an absorbing state across runs.
      raw: "roles/bigquery.dataEditor"
    service_account_project_roles:
      - "roles/bigquery.jobUser"

  drift-monitor-job:
    description: "PSI drift check of the latest feature snapshot against the champion's training baseline"
    ar_repository: "containers"
    image_name: "drift-monitor"
    image_tag: "latest"
    cpu: "1"
    memory: "512Mi"
    timeout: "600s"
    max_retries: 1
    env_vars:
      REGION: "europe-west1"
      BQ_FEATURES_TABLE: "features.customer_features"
      MODEL_DISPLAY_NAME: "churn-predictor"
      GCS_BUCKET: "pipeline-metadata"
      DECISION_BLOB: "drift/latest.json"
      # Must match submit_batch_predict's displayName in workflows/orchestrator-workflow.yaml —
      # disambiguates the daily production-scoring job from post-training's own evaluation-time
      # batch prediction runs against the same champion model.
      BATCH_PREDICT_DISPLAY_NAME: "daily-churn-scoring"
      # Persistence rule: a feature must breach in at least PERSISTENCE_MIN_BREACHES of the
      # last PERSISTENCE_WINDOW runs before retraining is triggered. A single night's breach
      # is not evidence of a distribution shift, and acting on one is what turns a noisy
      # detector into a nightly retrain loop.
      PERSISTENCE_WINDOW: "3"
      PERSISTENCE_MIN_BREACHES: "2"
      # Data-quality gate: preceding feature-table partitions the row-volume assertion
      # compares this snapshot against before allowing a retrain decision to stand.
      QUALITY_HISTORY_PARTITIONS: "7"
    bq_dataset_roles:
      features: "roles/bigquery.dataViewer"
      # dataEditor, not dataViewer: the job appends each run's per-feature PSI to
      # ml.drift_metrics, which is the history the persistence rule reads back.
      ml: "roles/bigquery.dataEditor"
    gcs_bucket_roles:
      pipeline-metadata: "roles/storage.objectAdmin"
      training-data: "roles/storage.objectViewer"
    service_account_project_roles:
      - "roles/bigquery.jobUser"
      - "roles/aiplatform.user"
