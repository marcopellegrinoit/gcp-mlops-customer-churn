steps:
  - id: test
    name: ghcr.io/astral-sh/uv:${_UV_VERSION}-python${_PYTHON_VERSION}-trixie-slim
    entrypoint: uv
    dir: projects/post-training
    env:
      - UV_LINK_MODE=copy
    args:
      - run
      - --frozen
      - --extra
      - dev
      - pytest
      - -m
      - "not integration"

  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg=UV_VERSION=${_UV_VERSION}
      - --build-arg=PYTHON_VERSION=${_PYTHON_VERSION}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/post-training:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/post-training:latest
      - -f
      - projects/post-training/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/post-training

  - id: trigger-pipeline-compile
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - builds
      - triggers
      - run
      - training-pipeline-trigger
      - --branch=$BRANCH_NAME
      - --region=${_REGION}

substitutions:
  _REGION: europe-west1
  _UV_VERSION: "0.11.19"
  _PYTHON_VERSION: "3.13"

options:
  logging: CLOUD_LOGGING_ONLY
