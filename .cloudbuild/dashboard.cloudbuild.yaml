steps:
  - id: lint
    name: ghcr.io/astral-sh/uv:${_UV_VERSION}-python${_PYTHON_VERSION}-trixie-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uvx ruff@${_RUFF_VERSION} check projects/dashboard
        uvx ruff@${_RUFF_VERSION} format --check projects/dashboard

  # No integration-test step: this container talks to exactly one external service
  # (BigQuery, read-only) and the emulator cannot execute the views the app reads, so an
  # emulator-backed test here would assert that a mock returns what the mock was told to.
  # The query layer's real contract — the byte ceiling and the table addresses — is covered
  # by unit tests instead.
  - id: test
    name: ghcr.io/astral-sh/uv:${_UV_VERSION}-python${_PYTHON_VERSION}-trixie-slim
    entrypoint: uv
    dir: projects/dashboard
    env:
      - UV_LINK_MODE=copy
    args:
      - run
      - --frozen
      - --extra
      - dev
      - pytest

  - id: audit
    name: ghcr.io/astral-sh/uv:${_UV_VERSION}-python${_PYTHON_VERSION}-trixie-slim
    entrypoint: uv
    dir: projects/dashboard
    env:
      - UV_LINK_MODE=copy
    args:
      - run
      - --frozen
      - --extra
      - dev
      - --with
      - pip-audit
      - pip-audit

  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg=UV_VERSION=${_UV_VERSION}
      - --build-arg=PYTHON_VERSION=${_PYTHON_VERSION}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/dashboard:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/dashboard:latest
      - -f
      - projects/dashboard/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/dashboard

  # `services update`, not `jobs update`: Terraform owns the shape of the service and
  # ignores changes to the image, so deploying a revision is CI's job. Unlike the Cloud Run
  # Jobs, this one is serving traffic, so the new revision takes it immediately on success.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - dashboard-service
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/containers/dashboard:$SHORT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID

substitutions:
  _REGION: europe-west1
  _UV_VERSION: "0.11.19"
  _PYTHON_VERSION: "3.13"
  # Pinned to the same rev as the ruff-pre-commit hook in .pre-commit-config.yaml, so a
  # manual `pre-commit run` and this CI gate never disagree about what's a lint failure.
  _RUFF_VERSION: "0.16.3"

options:
  logging: CLOUD_LOGGING_ONLY
